<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FairRent business model</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,560;8..60,650&display=swap" rel="stylesheet" />
<style>
  :root {
    --stage-w: 250px;
    --paper: #f3f1eb;
    --card: #fffcf8;
    --ink: #14202c;
    --muted: #5d6c78;
    --line: #e3ddd2;
    --fairrent: #2f7d52;
    --fairrent-bg: #e5f3eb;
    --landlord: #2f6ea8;
    --landlord-bg: #e6f1f8;
    --owns: #17324a;
    --owns-bg: #e7eef3;
    --third: #b26a22;
    --third-bg: #f8efe4;
    --module: #0f7c86;
    --module-bg: #e4f4f5;
    --risk: #b2433a;
    --risk-bg: #f8ecea;
    --platform: #102033;
    --revenue: #1d3f6e;
    --shadow: none;
    font-family: "Source Sans 3", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, .serif { font-family: "Source Serif 4", Georgia, serif; font-weight: 560; }
  [contenteditable="true"] { border-radius: 4px; }
  [contenteditable="true"]:hover { background: rgba(255,255,255,.45); }
  [contenteditable="true"]:focus { background: #fff; outline: 1px solid var(--line); }
  [contenteditable="true"]:empty::before { content: attr(data-placeholder); color: var(--muted); }

  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 10px 22px;
    background: rgba(243,241,235,.94);
    border-bottom: 1px solid var(--line);
  }
  .toolbar p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 280px; }
  .cluster { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn, .select, .num {
    border: 1px solid var(--line); background: var(--card); border-radius: 6px;
    padding: 5px 10px; font-size: 13px;
  }
  .btn:hover { border-color: #c9c1b4; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .width { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .width input { width: 110px; }

  .page { max-width: 1280px; margin: 0 auto; padding: 28px 22px 64px; }
  header.mast { margin-bottom: 18px; }
  header.mast h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  header.mast .sub { font-size: 17px; line-height: 1.45; margin: 0; max-width: 70ch; }
  .source { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 4px 10px 4px 6px; font-size: 13px;
  }
  .chip.on { border-color: var(--ink); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--tone); flex: 0 0 auto; }
  .legend-note { margin: 0 0 18px; color: var(--muted); font-size: 13px; max-width: 78ch; }

  .rail { display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center; margin: 0 0 12px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .rail span { white-space: nowrap; }
  .rail i { font-style: normal; margin: 0 8px; color: #b7b1a6; }

  .journey { display: flex; gap: 12px; align-items: stretch; }
  .journey.board { flex-wrap: wrap; }
  .journey.strip { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; }
  .card {
    flex: 1 1 var(--stage-w);
    min-width: min(100%, 300px);
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--tone, var(--ink));
    border-radius: 10px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .journey.strip .card { flex: 0 0 var(--stage-w); }
  .card.platform {
    flex-basis: calc(var(--stage-w) * 1.7);
    background: var(--platform); color: #f4f7f8; border-color: var(--platform); border-top-color: var(--module);
  }
  .journey.strip .card.platform { flex-basis: calc(var(--stage-w) * 1.7); }
  .card.dim, .line.dim, .panel.dim, .cap.dim { opacity: .38; }
  .card.drop, .line.drop, .panel.drop, .cap.drop { outline: 2px solid var(--ink); outline-offset: 2px; }

  .card-h, .panel-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; padding: 10px 12px 0; }
  .card.platform .card-h { padding-bottom: 0; }
  .kicker { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tone); font-weight: 700; }
  .card.platform .kicker { color: #8fd0d4; }
  .kicker, .card-h .serif, .panel-h .serif, .lede, .sub, .source, .disclaimer,
  .line .text, .cap .text, .item .text, .foot .text {
    display: block; width: 100%; white-space: normal; overflow-wrap: break-word;
  }
  .cluster .text { display: inline-block; width: auto; min-width: 8em; }
  .card-h .serif { margin: 2px 0 0; font-size: 20px; line-height: 1.25; }
  .panel-h .serif { font-size: 18px; line-height: 1.25; color: #fff; }
  .band .serif { display: block; font-size: 22px; line-height: 1.3; }
  .fee { font-family: "Source Serif 4", Georgia, serif; }
  .grow { flex: 1 1 100%; min-width: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .icon, .mini {
    border: 1px solid var(--line); background: rgba(255,255,255,.7); border-radius: 5px;
    padding: 2px 6px; font-size: 12px; line-height: 1.4;
  }
  .card.platform .icon, .card.platform .mini, .card.platform .select { background: #1b3148; color: #f4f7f8; border-color: #2c4664; }
  .grip { cursor: grab; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .line, .cap, .item {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start;
    padding: 7px 8px; border-radius: 7px; background: var(--tone-bg, var(--paper));
    border-left: 3px solid var(--tone, var(--line));
  }
  .line .text, .cap .text, .item .text { flex: 1 1 100%; }
  .item { border-left-width: 0; background: transparent; padding: 4px 0; }
  .line .text, .cap .text, .item .text, .foot .text { min-width: 0; font-size: 14px; line-height: 1.45; }
  .foot { margin-top: auto; padding: 8px 12px; background: var(--tone-bg); border-radius: 0 0 9px 9px; font-size: 13px; }
  .card.platform .foot { background: transparent; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side { background: #1b3148; border-radius: 8px; padding: 8px; }
  .side .label { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8fd0d4; font-weight: 700; }
  .side .text { font-size: 13px; line-height: 1.35; }
  .lede { margin: 0; color: #d5dee6; font-size: 14px; line-height: 1.4; }
  .caps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cap { background: #163246; border-left-color: var(--module); color: #f4f7f8; }
  .add { align-self: flex-start; }

  .panels { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
  .panel {
    grid-column: span var(--span, 4);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    min-width: 0; display: flex; flex-direction: column;
  }
  .panel-h { padding: 10px 12px; background: var(--tone); color: #fff; border-radius: 9px 9px 0 0; }
  .panel-h h2 { font-size: 18px; margin: 0; }
  .panel-h .icon, .panel-h .mini, .panel-h .select { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.28); }
  .panel .body { padding: 12px 14px 14px; }
  .span-read { font-size: 12px; opacity: .85; }

  .streams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stream h3 { margin: 0 0 4px; font-size: 15px; }
  .stream .fee { margin: 0; font-size: 22px; }
  .stream .text { font-size: 14px; line-height: 1.4; }
  .figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .figure { background: var(--paper); border-radius: 8px; padding: 10px; }
  .figure span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .figure strong { display: block; font-size: 26px; line-height: 1.1; }
  .figure .num { width: 100%; margin-top: 6px; background: #fff; }
  .formula, .disclaimer { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .warn { color: var(--risk); }

  .band {
    margin-top: 22px; background: var(--platform); color: #f4f7f8;
    border-radius: 12px; padding: 18px 20px;
  }
  .band h2 { margin: 0 0 6px; font-size: 22px; }
  .band p { margin: 0; font-size: 16px; line-height: 1.45; }

  body.presenting .edit-only { display: none !important; }
  @media (max-width: 860px) {
    header.mast h1 { font-size: 28px; }
    .panel { grid-column: 1 / -1 !important; }
    .streams, .figures, .caps, .sides { grid-template-columns: 1fr; }
  }
  @media print {
    .toolbar, .edit-only { display: none !important; }
    .page { max-width: none; }
    .card, .panel { break-inside: avoid; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = "fairrent-model-board-v1";

const TONES = {

  owns: { label: "Landlord owns", ink: "#17324a", bg: "#e7eef3" },

const POSTER = {

  ],

    {
      id: "s1", kind: "stage", tone: "fairrent", kicker: "Stage 1", title: "Property listing",

    },
    {

      lines: [
        { id: "s2a", tone: "landlord", text: "Tenant discovers and applies for a property." },
        { id: "s2b", tone: "fairrent", text: "FairRent provides matching functionality and a transparent tenant-scoring process." },

      ],
      foot: { tone: "fairrent", text: "FairRent facilitates; the landlord decides." }
    },
    {
      id: "s3", kind: "stage", tone: "fairrent", kicker: "Stage 3", title: "Viewing scheduling",
      lines: [
        { id: "s3a", tone: "fairrent", text: "FairRent provides a shared calendar." },
        { id: "s3b", tone: "landlord", text: "Landlord and tenant select mutually convenient viewing times." },
        { id: "s3c", tone: "landlord", text: "Landlord conducts the physical viewing." }
      ],
      foot: { tone: "landlord", text: "Scheduling by FairRent; viewing by the landlord." }
    },
    {
      id: "hub", kind: "platform", tone: "platform", kicker: "FairRent platform",
      title: "Tenant matching, scoring, digital coordination and maintenance workflow",
      leftLabel: "Tenant",
      leftText: "Information, application and personal viewing",
      rightLabel: "Third-party service providers",
      rightText: "Payment, referencing and contractors",
      capabilities: [
        { id: "c1", tone: "module", text: "Property marketplace and tenant matching" },
        { id: "c2", tone: "module", text: "Tenant scoring and assessment tools" },
        { id: "c3", tone: "module", text: "Shared viewing calendar and digital tenancy records" },
        { id: "c4", tone: "module", text: "Maintenance reporting, triage, coordination and outcome tracking" }
      ]
    },
    {
      id: "s5", kind: "stage", tone: "landlord", kicker: "Stage 5", title: "Rental payment setup",
      lines: [
        { id: "s5a", tone: "landlord", text: "Tenant establishes a recurring payment instruction to the landlord’s nominated bank account, using a supported payment provider." },
        { id: "s5b", tone: "landlord", text: "Rent flows directly to the landlord." },
        { id: "s5c", tone: "risk", text: "FairRent does not receive, hold or distribute rent." },
        { id: "s5d", tone: "landlord", text: "Landlord monitors receipts and manages arrears." }
      ],
      foot: { tone: "third", text: "Payment infrastructure is supplied by a suitable third party. The landlord handles rent collection and arrears." }
    },
    {

      lines: [

        { id: "s6b", tone: "fairrent", text: "A FairRent virtual assistant triages the request, gathers information and coordinates with an independent contractor." },
        { id: "s6c", tone: "third", text: "Contractor assesses the problem and provides a quotation." },

  ],
  panels: [
    listPanel("p-fr", "FairRent owns", "fairrent", 4, [
      "Digital rental marketplace",
      "Tenant matching and scoring tools",
      "Shared viewing calendar",

      "Supported recurring-payment setup workflow",
      "Maintenance request intake and triage",
      "Virtual-assistant coordination",
      "Contractor network administration",
      "Quotation communication",
      "Maintenance tracking and performance records",
      "Platform reporting and notifications"
    ]),
    listPanel("p-ll", "Landlord owns", "owns", 4, [
      "Property listing accuracy",
      "Final tenant selection",
      "Physical viewings",
      "Completing the tenancy agreements",
      "Receiving rent directly",
      "Monitoring rent payments",
      "Chasing arrears",
      "Approving repair expenditure",
      "Paying contractors for maintenance",
      "Meeting applicable landlord obligations",
      "Making decisions when urgent issues are escalated"
    ]),
    listPanel("p-tp", "Third parties deliver", "third", 4, [
      "Bank or payment provider executes supported payment instructions",
      "Independent handymen and tradespeople inspect and repair properties",
      "Specialist contractors handle complex or regulated work",

      "Legal professionals provide advice when required"
    ]),
    {
      id: "p-rev", kind: "revenue", tone: "revenue", span: 7, title: "Revenue",
      lettingPct: 25,
      bandLow: 2,
      bandHigh: 3,
      basis: "rental income",
      lettingWhen: "Charged when a landlord successfully lets a property through FairRent.",
      covers: "Covers the defined digital platform and maintenance-coordination service.",
      rent: 2000,
      illustrationPct: 2.5,
      disclaimer: "Figures are labelled as illustrative and subject to final pricing and VAT treatment.",
      repairNote: "Landlords pay repair and maintenance costs directly. FairRent coordinates the process but does not automatically absorb repair expenditure."
    },
    listPanel("p-op", "Operating model", "fairrent", 5, [
      "One or two virtual assistants at launch",
      "Centralised digital maintenance workflow",
      "Independent local contractor network",
      "Landlord approval before non-emergency expenditure",
      "Escalation for urgent, complex or unresolved issues",
      "Performance tracking through the application"
    ]),
    listPanel("p-not", "What FairRent deliberately does not do", "risk", 4, [
      "Does not conduct physical property viewings",
      "Does not make the final tenant-selection decision",
      "Does not prepare or complete tenancy agreements on the landlord’s behalf",
      "Does not receive, hold or distribute rental income",
      "Does not act as a full-service rent-collection agent",
      "Does not fund ordinary repairs from the management fee",
      "Does not physically perform maintenance",
      "Does not automatically assume all landlord compliance obligations",
      "Does not provide unrestricted or unlimited maintenance cover"
    ]),
    listPanel("p-adv", "Strategic advantages", "fairrent", 4, [
      "Lower-cost alternative to traditional letting agents",
      "Clear separation between software, coordination and physical service delivery",
      "Lower fixed staffing requirements",
      "No routine exposure to underlying repair expenditure",
      "Transparent contractor quotations and expenditure",
      "Potential network effects between landlords and tenants",
      "Potential to improve tenant matching and operational efficiency through data",
      "Recurring revenue from ongoing platform usage"
    ]),
    listPanel("p-risk", "Key risks to validate", "risk", 4, [
      "Landlords must be willing to conduct viewings and manage arrears",
      "Tenant scoring must be accurate, fair, transparent and appropriately governed",
      "Direct-to-landlord payments require an appropriate technical and legal structure",
      "Maintenance requests can become labour-intensive",
      "Emergency issues require clear escalation procedures",
      "Low recurring fees may limit customer-acquisition budgets",

};

function listPanel(id, title, tone, span, items) {
  return {
    id, kind: "list", title, tone, span,
    items: items.map((text, i) => ({ id: id + "-" + (i + 1), text }))
  };
}

let model = load();
let undoStack = [];
let drag = null;
let seq = 100;

function clone(value) { return JSON.parse(JSON.stringify(value)); }
function uid(prefix) { seq += 1; return prefix + "-" + seq.toString(36); }
function money(value) {
  return new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 0 }).format(Math.round(Number(value) || 0));
}
function editing() { return model.ui.editing !== false; }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.version === 1 && Array.isArray(parsed.journey) && Array.isArray(parsed.panels)) return parsed;
    }
  } catch (err) { /* use the poster */ }
  return clone(POSTER);
}
function commit() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(model)); } catch (err) { /* private mode */ }
  const tag = document.getElementById("save-state");
  if (tag) tag.textContent = "Saved in this browser";
}
function snapshot() {
  undoStack.push(JSON.stringify(model));
  if (undoStack.length > 60) undoStack.shift();
}
function undo() {
  const prev = undoStack.pop();
  if (!prev) return;
  model = JSON.parse(prev);
  commit();
  render();
}
function resetPoster() {
  if (!confirm("Replace your edits with the source diagram?")) return;
  snapshot();
  model = clone(POSTER);
  commit();
  render();
}

function h(tag, attrs, kids) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([key, value]) => {
    if (value == null || value === false) return;
    if (key === "class") node.className = value;
    else if (key === "style") node.setAttribute("style", value);
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value === true ? "" : value);
  });
  (kids || []).flat().forEach((kid) => {
    if (kid == null || kid === false) return;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return node;
}
function cssVars(tone) {
  const meta = TONES[tone] || TONES.fairrent;
  return "--tone:" + meta.ink + ";--tone-bg:" + meta.bg;
}
function editable(value, attrs, onCommit) {
  const node = h("div", Object.assign({ contenteditable: editing() ? "true" : "false", spellcheck: "true" }, attrs));
  node.textContent = value || "";
  node.addEventListener("paste", (event) => {
    event.preventDefault();
    const text = (event.clipboardData || window.clipboardData).getData("text/plain");
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    sel.deleteFromDocument();
    sel.getRangeAt(0).insertNode(document.createTextNode(text));
    sel.collapseToEnd();
  });
  node.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); node.blur(); }
  });
  node.addEventListener("blur", () => {
    const next = node.textContent.replace(/\s+/g, " ").trim();
    if (next === (value || "")) return;
    snapshot();
    onCommit(next);
    commit();
  });
  return node;
}

function importJson(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || !Array.isArray(parsed.journey) || !Array.isArray(parsed.panels)) throw new Error("missing");
      snapshot();
      parsed.version = 1;
      parsed.ui = Object.assign(clone(POSTER.ui), parsed.ui || {});
      model = parsed;
      commit();
      render();
    } catch (err) {
      alert("That file is not a FairRent model export.");
    }
  };
  reader.readAsText(file);
}

    ]),
    h("label", { class: "width edit-only" }, ["Card width", width]),
    h("div", { class: "cluster" }, [
      layout,
      button(editing() ? "Present" : "Edit", () => { model.ui.editing = !editing(); commit(); render(); }, "btn primary"),
      undoBtn,
      button("Reset", resetPoster, "btn edit-only"),
      button("Export", exportJson, "btn edit-only"),
      button("Import", () => file.click(), "btn edit-only"),
      file
    ])
  ]);
}

document.addEventListener("keydown", (event) => {
  const typing = document.activeElement && document.activeElement.isContentEditable;
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z" && !typing) {
    event.preventDefault();
    undo();
  }
});

render();
</script>
</body>
</html>
